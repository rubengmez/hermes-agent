# Compila Hermes Desktop para Windows y deja el ejecutable portable como artefacto.
#
# FUENTE: compila SIEMPRE el upstream de Nous (NousResearch/hermes-agent@main),
# no el fork. Así queda al día automáticamente sin tener que sincronizar el
# fork cuando Nous actualice.
#
# DISPARO:
#   - manual  (Actions > "Hermes Desktop Windows (portable)" > Run workflow)
#   - semanal  (cron, UTC) — rebuild automático con la última versión
#   - en push de tags "v*"
#
# No modifica Hermes Agent ni instala nada en la máquina: en el runner se
# compila SOLO la GUI (apps/desktop) como "lite client" (sin el agente local)
# y se sube el resultado para descargar.

name: Hermes Desktop Windows (portable)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 0'   # cada domingo a las 06:00 UTC
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: hermes-desktop-win
  cancel-in-progress: true

jobs:
  build-desktop-win:
    name: Build Hermes Desktop (win x64)
    # Runner nativo de Windows: la dist de Electron local ya es la correcta.
    # Desde Linux (compilación cruzada) falla por node-pty/get-windows nativos;
    # en windows-latest eso no ocurre.
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      # ── Checkout del UPSTREAM de Nous, no del fork ───────────────────
      # Así cada run usa la última versión publicada de Hermes sin depender
      # del estado de sincronización de rubengmez/hermes-agent.
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: main

      # ── Node ─────────────────────────────────────────────────────────
      # Misma línea que usa el CI oficial de Nous (node 26 + npm 12).
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Alinear npm a la línea 12 (igual que el CI oficial)
        run: |
          npm --version | Select-String '^12\.' -Quiet
          if (-not $LASTEXITCODE) { npm i -g npm@12 }

      # ── Dependencias ─────────────────────────────────────────────────
      # npm ci (no --ignore-scripts): el postinstall de Electron descarga el
      # binario de Windows y node-pty deja sus prebuilds win32-x64 nativos.
      - name: Instalar dependencias del workspace
        run: npm ci

      # ── Compilar SOLO la app de escritorio (GUI, sin agent runtime) ──
      # `pack` = app desempaquetada portable (release/win-unpacked/Hermes.exe),
      # sin instalador. Es el artefacto que queremos.
      - name: Build app de escritorio (pack)
        working-directory: apps/desktop
        run: npm run pack

      # ── Empaquetar en un zip para descargar de una pieza ─────────────
      - name: Comprimir app portable (zip)
        working-directory: apps/desktop/release
        run: |
          Compress-Archive -Path win-unpacked -DestinationPath Hermes-desktop-portable-win-x64.zip -Force

      # ── Subir artefacto ──────────────────────────────────────────────
      - name: Subir artefacto portable
        uses: actions/upload-artifact@v4
        with:
          name: hermes-desktop-portable-win-x64
          path: apps/desktop/release/Hermes-desktop-portable-win-x64.zip
          retention-days: 30