# Compila Hermes Desktop (Windows portable) desde el upstream de Nous y lo
# publica. Cada ejecución:
#   1. Baja el código más reciente de NousResearch/hermes-agent@main (siempre
#      al día, sin tener que sincronizar el fork).
#   2. Compila SOLO la GUI como "lite client" (sin el agente local).
#   3. Sube un artefacto de Actions Y publica una GitHub Release versionada.
#
# DISPARO:
#   - manual      (Actions > "Hermes Desktop Windows (portable)" > Run workflow)
#   - semanal     (cron) — rebuild automático con la última versión
#   - push de tag "v*"
#
# Las Releases se crean en el repo donde corre el workflow (tu fork).

name: Hermes Desktop Windows (portable)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 0'   # cada domingo a las 06:00 UTC
  push:
    tags:
      - 'v*'

permissions:
  contents: write          # necesario para publicar la GitHub Release
  actions: read

concurrency:
  group: hermes-desktop-win
  cancel-in-progress: true

jobs:
  build-desktop-win:
    name: Build Hermes Desktop (win x64)
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      # ── Checkout del UPSTREAM de Nous, no del fork ───────────────────
      # El workflow corre en tu fork, pero el código que se compila es el
      # último de Nous. Así cada release queda al día automáticamente.
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: main

      # ── Node (solo para COMPILAR en CI; el cliente final no lo usa) ──
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Alinear npm a la línea 12 (igual que el CI oficial)
        run: |
          npm --version | Select-String '^12\.' -Quiet
          if (-not $LASTEXITCODE) { npm i -g npm@12 }

      - name: Instalar dependencias del workspace
        run: npm ci

      # ── Compilar la app de escritorio (GUI portable, sin agent) ──────
      - name: Build app de escritorio (pack)
        working-directory: apps/desktop
        run: npm run pack

      # ── Empaquetar en un zip ─────────────────────────────────────────
      - name: Comprimir app portable (zip)
        id: zip
        working-directory: apps/desktop/release
        run: |
          Compress-Archive -Path win-unpacked -DestinationPath Hermes-desktop-portable-win-x64.zip -Force

      # ── Artefacto de Actions (descarga rápida, retención 30 días) ────
      - name: Subir artefacto portable
        uses: actions/upload-artifact@v4
        with:
          name: hermes-desktop-portable-win-x64
          path: apps/desktop/release/Hermes-desktop-portable-win-x64.zip
          retention-days: 30

      # ── GitHub Release versionada (descarga estable e ilimitada) ─────
      # Solo en ejecuciones programadas/manuales (no en tageos v*, que ya
      # llevarían su propia release).
      - name: Publicar GitHub Release
        if: github.event_name != 'push'
        uses: softprops/action-gh-release@v2
        with:
          repository: rubengmez/hermes-agent
          name: "Hermes Desktop portable - win-x64 (${{ github.run_number }})"
          tag_name: "desktop-portable-${{ github.run_number }}"
          body: |
            Build portable (lite client) de Hermes Desktop para Windows x64.

            - **Fuente:** NousResearch/hermes-agent@main (compilado en este run)
            - **Run:** #${{ github.run_number }}
            - **Fecha:** ${{ github.event.schedule != '' && 'programado semanal' || github.event_name }}
            - **Conexión remota:** en la app, Settings → Gateways → Remote gateway, o con `HERMES_DESKTOP_REMOTE_URL`.
            - **Sin firmar:** SmartScreen puede avisar al abrir (Más información → Ejecutar de todas formas).
          files: apps/desktop/release/Hermes-desktop-portable-win-x64.zip
          generate_release_notes: false
          draft: false
          prerelease: false